<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaveView Weather Planner - Finish Setup</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e8e4dc;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:460px;background:#141414;border:1px solid #242424;border-top:2px solid #5dd39e;padding:28px}
h1{font-size:28px;margin-bottom:8px}
p{color:#9b968d;line-height:1.5;margin-bottom:14px}
.email{font-family:monospace;font-size:12px;padding:10px;border:1px solid #2a2a2a;background:#0d0d0d;margin-bottom:14px;color:#5dd39e}
label{display:block;font-size:12px;color:#9b968d;margin:10px 0 6px}
input{width:100%;padding:11px;border:1px solid #2a2a2a;background:#0d0d0d;color:#e8e4dc}
button{margin-top:14px;width:100%;padding:12px;border:none;background:#5dd39e;color:#052012;font-weight:700;cursor:pointer}
.msg{display:none;margin-top:12px;padding:10px;font-size:12px}
.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#ff9a9a}
.ok{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#98f0b6}
</style>
</head>
<body>
  <div class="card">
    <h1>Payment Received</h1>
    <p>We use the same email used in Stripe checkout. Create your password to finish account setup.</p>
    <div class="email" id="payer-email">Loading checkout email...</div>
    <label>Full Name (optional)</label>
    <input id="name" type="text" placeholder="Your name">
    <label>Create Password</label>
    <input id="password" type="password" placeholder="Minimum 6 characters">
    <label>Confirm Password</label>
    <input id="password2" type="password" placeholder="Repeat password">
    <button id="finish-btn">Finish Setup</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
const SUPABASE_URL = 'https://rqgyqqyxlwjpbdkapvpz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxZ3lxcXl4bHdqcGJka2FwdnB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MDIxNzAsImV4cCI6MjA4OTE3ODE3MH0.DmBw-rXJOQo8FI1L0Fe2JnQ0PIzCqp6sXaJzgafUw5A';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function setMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = `msg ${type === 'error' ? 'err' : 'ok'}`;
}

function sessionIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('session_id') || params.get('stripe_session_id') || params.get('checkout_session_id') || '';
}

let sessionId = '';
let payerEmail = '';

async function loadSessionEmail() {
  sessionId = sessionIdFromUrl();
  if (!sessionId) {
    setMsg('Missing checkout session id. Open this page from your Stripe success redirect.', 'error');
    return;
  }
  const resp = await fetch(`/api/weather-payment-session?session_id=${encodeURIComponent(sessionId)}`);
  const payload = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    setMsg(payload.error || 'Could not verify Stripe checkout.', 'error');
    return;
  }
  payerEmail = String(payload.email || '');
  document.getElementById('payer-email').textContent = payerEmail;
}

async function finishSetup() {
  const name = String(document.getElementById('name').value || '').trim();
  const p1 = String(document.getElementById('password').value || '');
  const p2 = String(document.getElementById('password2').value || '');
  if (!sessionId || !payerEmail) {
    setMsg('Checkout session is not verified yet.', 'error');
    return;
  }
  if (p1.length < 6) {
    setMsg('Password must be at least 6 characters.', 'error');
    return;
  }
  if (p1 !== p2) {
    setMsg('Passwords do not match.', 'error');
    return;
  }
  const btn = document.getElementById('finish-btn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';
  const resp = await fetch('/api/weather-purchase-signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      stripeSessionId: sessionId,
      password: p1,
      name
    })
  });
  const payload = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    setMsg(payload.error || 'Could not create account.', 'error');
    btn.disabled = false;
    btn.textContent = 'Finish Setup';
    return;
  }
  const signedIn = await sb.auth.signInWithPassword({ email: payerEmail, password: p1 });
  if (signedIn.error) {
    setMsg('Account created. Please log in from the Weather Planner page.', 'ok');
    return;
  }
  setMsg('Setup complete. Opening Weather Planner...', 'ok');
  setTimeout(() => { window.location.href = '/weather-dashboard.html'; }, 800);
}

document.getElementById('finish-btn').addEventListener('click', finishSetup);
loadSessionEmail();
</script>
</body>
</html>
